<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melvor Ledger — money planner for Melvor Idle 2</title>
  <meta name="description" content="Paste your Melvor Idle 2 save string and see every way your account can make gold, ranked by GP per hour." />
  <meta name="theme-color" content="#0c0d12" />
  <link rel="icon" href="icons/Currencies_GoldPieces.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="modulepreload" href="js/app.js" />
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg-glow"></div><div class="bg-grain"></div></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Melvor Ledger home">
      <span class="brand-coin"><img src="icons/Currencies_GoldPieces.webp" alt="" width="28" height="28" /></span>
      <span class="brand-name">Melvor <em>Ledger</em></span>
    </a>
    <nav class="tabs" id="tabs" role="tablist" hidden></nav>
    <div class="topbar-right" id="topbar-right"></div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="footer">
    <p>Base rates from the game's own data and formulas (<span id="game-version">Alpha 0.11.5.5</span>). Tool, mastery, potion and pet bonuses are not applied yet, so real rates are usually higher.</p>
    <p>Fan-made and unofficial. Not affiliated with Games by Malcs. Your save is decoded in your browser and never uploaded.</p>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
